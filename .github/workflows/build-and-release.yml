name: Android CI Build and Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            apk_path: app/build/outputs/apk/debug/app-debug.apk
          - build_type: Release
            apk_path: app/build/outputs/apk/release/app-release.apk

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION_NAME"

    - name: Build ${{ matrix.build_type }} APK
      run: ./gradlew assemble${{ matrix.build_type }} --stacktrace

    - name: Rename APK
      id: rename
      run: |
        COMMIT_ID=$(git rev-parse --short HEAD)
        VERSION="${{ steps.version.outputs.version }}"
        BUILD_TYPE="${{ matrix.build_type }}"
        APK_DIR=$(dirname "${{ matrix.apk_path }}")
        NEW_APK_NAME="FlashLabs-${VERSION}-${COMMIT_ID}-${BUILD_TYPE}.apk"
        mv "${{ matrix.apk_path }}" "${APK_DIR}/${NEW_APK_NAME}"
        echo "new_apk_path=${APK_DIR}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT

    - name: Upload ${{ matrix.build_type }} APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlashLabs-${{ matrix.build_type }}-${{ steps.version.outputs.version }}
        path: ${{ steps.rename.outputs.new_apk_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for release notes

    - name: Extract Version Name
      id: version
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION_NAME"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Zip Source Code & Assets
      run: |
        zip -r FlashLabs-SourceCode.zip . -x "*.git*" "*.gradle*" "*build*" "*.idea*"

    - name: Generate Commits Log
      id: changelog
      run: |
        echo "commits<<EOF" >> $GITHUB_OUTPUT
        git log -n 10 --oneline >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
        name: FlashLabs v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
        body: |
          ### Nuevo Release de FlashLabs v${{ steps.version.outputs.version }}
          
          **Últimos commits:**
          ```
          ${{ steps.changelog.outputs.commits }}
          ```
          
          Descarga los APKs firmados (Release y Debug) en la sección de Assets.
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/**/*.apk
          FlashLabs-SourceCode.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
